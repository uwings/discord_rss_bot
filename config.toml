# ===== AI 新闻 RSS Bot 配置 =====

[poll]
interval_minutes = 30          # 常驻模式下每轮间隔
max_age_hours = 72             # 只推送 72 小时内的文章
bootstrap = "mark"             # 首次运行历史为空时：mark=只建档不推送；catch_up=照推
request_timeout_seconds = 20
retention_days = 14            # 历史记录保留天数（决定去重记忆长度）
enrich_summaries = true        # feed 无摘要时（如 Hugging Face）回源文章页提取导语

[http]
# 留空直连；需要代理时填如 "http://127.0.0.1:7890"（也可用 HTTPS_PROXY 环境变量）
proxy = ""

[translation]
# auto  = 配置了 LLM 就用 LLM，否则用免费 Google 翻译（默认）
# google = 始终用免费 Google 翻译
# llm   = 始终用大模型翻译+摘要
# none  = 不翻译
provider = "auto"
summary_chars = 400

[llm]
enabled = false
base_url = "https://api.openai.com/v1"   # 任何 OpenAI 兼容端点均可（含国内服务）
model = "gpt-4o-mini"
# API key 在 .env 的 LLM_API_KEY 中填写

